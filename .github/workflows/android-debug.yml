name: Android builds and update verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and pinned FrostFrontend
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Activity control profile initializes
        run: python3 tests/test_control_profile.py

      - name: Test the production update verifier
        run: python3 tests/test_updates.py

      - name: Test input ownership and pause lifecycle
        run: node tests/test_input.cjs

      - name: Use runner preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

      - name: Install Android 35 platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Retrieve official Ruffle 0.7.1 runtime
        run: |
          mkdir -p /tmp/ruffle-package app/src/main/assets/www/ruffle
          curl --fail --silent --show-error --location \
            https://registry.npmjs.org/@ruffle-rs/ruffle/-/ruffle-0.7.1.tgz \
            -o /tmp/ruffle-0.7.1.tgz
          tar -xzf /tmp/ruffle-0.7.1.tgz -C /tmp/ruffle-package
          rufflejs="$(find /tmp/ruffle-package -type f -name ruffle.js -print -quit)"
          test -n "$rufflejs"
          cp -R "$(dirname "$rufflejs")"/. app/src/main/assets/www/ruffle/

      - name: Verify game SWF is not committed
        run: |
          if find app/src/main/assets/www -type f -iname '*.swf' | grep -q .; then
            echo 'Unexpected original Flash game in assets.'
            exit 1
          fi

      - name: Compile Debug and Release Android APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Verify APK contains no copyrighted game SWF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os, re, subprocess
          aapt = Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0/aapt'
          package = 'io.github.frostie77.newgroundsrumble'
          for variant, filename in (("debug", "app-debug.apk"), ("release", "app-release-unsigned.apk")):
              apk = Path('app/build/outputs/apk') / variant / filename
              assert apk.is_file(), f'{variant} APK was not generated'
              with ZipFile(apk) as z:
                  names = set(z.namelist())
                  assert not any(p.lower().endswith('.swf') for p in names), 'Game SWF bundled'
                  assert 'assets/www/ruffle/ruffle.js' in names, 'Ruffle missing'
                  assert 'assets/www/index.html' in names, 'Game wrapper missing'
              resources = subprocess.check_output([str(aapt), 'dump', 'resources', str(apk)], text=True)
              assert package + ':mipmap/ic_launcher' in resources, 'Launcher resource missing'
              badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
              selected_icon = re.search(r"(?m)^application:.*icon='([^']+)'", badging)
              assert selected_icon and selected_icon.group(1) in names, 'Selected launcher icon missing'
              if variant == 'release':
                  assert 'application-debuggable' not in badging, 'Release APK is debuggable'
              print(f'PASS: {variant} APK contains Ruffle and a launcher icon without game SWF')
          PY

      - name: Retain development APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: Newgrounds-Rumble-Android-debug-for-testing
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  windows-build-script:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Parse helpers with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($name in @('build-test.ps1', 'build-public-release.ps1')) {
            $parseErrors = $null
            $tokens = $null
            $file = Join-Path $env:GITHUB_WORKSPACE $name
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
          Write-Host 'PASS: build helpers parse in Windows PowerShell 5.1.'

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Install Android 35 platform
        shell: powershell
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK setup failed.' }

      - name: Exercise release signing and mismatched-key protection with a disposable key
        shell: powershell
        run: |
          $productionFeed = Join-Path $env:GITHUB_WORKSPACE 'updates\android-stable.json'
          $productionFeedHash = (Get-FileHash -Algorithm SHA256 $productionFeed).Hash
          # A local fixture commit resets only the feed, allowing disposable-key
          # tests to keep working after the real permanent signer is published.
          $fixtureRepo = Join-Path $env:RUNNER_TEMP 'rumble-release-fixture'
          & git clone --no-hardlinks $env:GITHUB_WORKSPACE $fixtureRepo
          if ($LASTEXITCODE -ne 0) { throw 'Fixture checkout failed.' }
          Set-Location $fixtureRepo
          $emptyFeed = @{schema_version=1; channel='stable'; package='io.github.frostie77.newgroundsrumble'; latest=$null}
          [System.IO.File]::WriteAllText((Join-Path $fixtureRepo 'updates\android-stable.json'), ($emptyFeed | ConvertTo-Json))
          & git add updates/android-stable.json
          & git -c user.name='Release Test' -c user.email='release-test@example.invalid' commit --allow-empty -m 'Set up isolated first-release fixture'
          if ($LASTEXITCODE -ne 0) { throw 'Fixture commit failed.' }
          $fixtureParent = (& git rev-parse HEAD^).Trim()
          if ($fixtureParent -ne $env:GITHUB_SHA) { throw 'Fixture does not derive from the workflow source.' }
          $env:RUMBLE_CI_SIGNING_PASSWORD = [Guid]::NewGuid().ToString('N')
          $fixture = Join-Path $env:RUNNER_TEMP 'rumble-disposable-test.keystore'
          & .\build-public-release.ps1 -KeystorePath $fixture -SigningPasswordEnvironment RUMBLE_CI_SIGNING_PASSWORD
          $sha = (& git rev-parse HEAD).Trim()
          $folder = Get-ChildItem '.\release' -Directory | Select-Object -First 1
          $feed = Get-Content -Raw (Join-Path $folder.FullName 'android-stable.json') | ConvertFrom-Json
          if ($feed.latest.source_commit -ne $sha) { throw 'Release source metadata mismatch.' }
          $apk = Join-Path $folder.FullName $feed.latest.apk_asset
          $beforeHash = (Get-FileHash -Algorithm SHA256 $apk).Hash.ToLowerInvariant()
          if ($beforeHash -ne $feed.latest.apk_sha256 -or (Get-Item $apk).Length -ne $feed.latest.apk_size) {
            throw 'Staged feed does not describe the actual signed APK.'
          }
          $pin = $fixture + '.certificate.sha256'
          $originalPin = Get-Content -Raw $pin
          $rejected = $false
          try {
            Set-Content -LiteralPath $pin -Value ('b' * 64)
            try {
              & .\build-public-release.ps1 -KeystorePath $fixture -SigningPasswordEnvironment RUMBLE_CI_SIGNING_PASSWORD
            } catch {
              if ($_.Exception.Message -notmatch 'established local release identity') { throw }
              $rejected = $true
            }
          } finally {
            Set-Content -LiteralPath $pin -Value $originalPin
            Remove-Item Env:\RUMBLE_CI_SIGNING_PASSWORD
          }
          if (-not $rejected) { throw 'Mismatched release identity was accepted.' }
          if ((Get-FileHash -Algorithm SHA256 $apk).Hash.ToLowerInvariant() -ne $beforeHash) {
            throw 'Failed signing attempt changed the verified candidate.'
          }
          $live = Get-Content -Raw '.\updates\android-stable.json' | ConvertFrom-Json
          if ($null -ne $live.latest) { throw 'Release preparation activated the live feed.' }
          if ((Get-FileHash -Algorithm SHA256 $productionFeed).Hash -ne $productionFeedHash) {
            throw 'Fixture changed the production feed.'
          }
          Write-Host 'PASS: real signed APK, matching feed, signature/identity checks and rejected mismatched key; live feed unchanged.'
